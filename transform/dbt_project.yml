name: aria_str
version: "1.0"
profile: meltano
config-version: 2
require-dbt-version: [">=1.0.0", "<2.0.0"]
flags:
  send_anonymous_usage_stats: false
  use_colors: true

model-paths: [models]
analysis-paths: [analysis]
test-paths: [tests]
seed-paths: [data]
macro-paths: [macros]
snapshot-paths: [snapshots]
target-path: target
log-path: logs
packages-install-path: dbt_packages
clean-targets: [target, dbt_packages, logs]

vars:
  bq_project: "{{ env_var('ARIA_BQ_PROJECT', 'hospitalityops-dev') }}"
  org_id: "{{ env_var('ARIA_ORG_ID', '1782243883257222643') }}"
  property_id: "{{ env_var('ARIA_PROPERTY_ID', 'cmrmb56w4000dbqu95a06jr1t') }}"
  costar_property_id: "{{ env_var('ARIA_COSTAR_PROPERTY_ID', '4603810') }}"
  fiscal_year_start_month: "{{ env_var('ARIA_FISCAL_YEAR_START_MONTH', '1') | int }}"
  source: mlt_str

models:
  aria_str:
    staging:
      +materialized: table
      +schema: silver
    marts:
      +materialized: table
      +schema: gold
