[project]
name = "str-connector"
version = "0.1.0"
description = "aria-runner connector for the CoStar STR daily grid"
requires-python = ">=3.11"
dependencies = ["aria-runner"]

[project.entry-points."aria_runner.connectors"]
str = "str_connector:connector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["str_connector"]
