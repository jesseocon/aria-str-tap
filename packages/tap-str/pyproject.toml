[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "tap-str"
version = "0.1.0"
description = "Singer tap for Str via Playwright."
readme = "README.md"
authors = [{ name = "Jesse Ocon", email = "jesse.ocon@growthnirvana.com" }]
requires-python = ">=3.10"
dependencies = [
    "singer-playwright @ git+https://github.com/jesseocon/aria-singer-playwright.git@v0.1.0",
    "singer-sdk~=0.54.5",
    "typing-extensions>=4.5.0; python_version < '3.13'",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
tap-str = "tap_str.tap:TapStr.cli"

[dependency-groups]
test = [
    "pytest>=9",
    "singer-sdk[testing]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
